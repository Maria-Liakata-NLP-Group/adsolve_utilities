[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adsolve-utils"              # the pip install name
version = "0.1.0"
description = "Utilities developed within the AdSoLve project for LLM generation and evaluation."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Sebastian Lobbers", email = "s.lobbers@qmul.ac.uk" }]

# Put only your *direct runtime* deps here; use sensible lower bounds
dependencies = [
  "bert-score>=0.3.13",
  "datasets>=4.0.0",
  "nltk>=3.9.1",
  "numpy>=2.3",
  "pandas>=2.3",
  "peft>=0.15.2",
  "PyYAML>=6.0",
  # Provides `Readability` (grade-level scores) for metrics/readability_metric.py.
  # NOT readability-lxml, which claims the same `readability` module name but is
  # an unrelated HTML article extractor exposing only `Document`.
  "py-readability-metrics>=1.4.5",
  "rouge>=1.0.1",
  "spacy>=3.8",
  "tqdm>=4.67",
  "transformers>=4.52",
  # See Torch note below — often better as an extra
]

[project.optional-dependencies]
# Let users choose their Torch build (CPU/CUDA) explicitly:
torch = ["torch>=2.7"]
dev = ["pytest>=8.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/Maria-Liakata-NLP-Group/adsolve_utilities"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "docs*", "**/__pycache__"]

# Include your YAML/JSON prompt files in the wheel (optional)
[tool.setuptools.package-data]
models = ["prompts/*.yaml", "example_data/*.json"]

[tool.pytest.ini_options]
markers = ["slow: runs a real evaluation subprocess; deselected by default"]
addopts = "-m 'not slow'"
